services:
  - type: web
    name: qcrm-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qcrm-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET_PATH
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://qcrm-dashboard.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://qcrm-dashboard.onrender.com,https://qcrm-admin.onrender.com,https://qcrm-site.onrender.com
      - key: D360_API_URL
        value: https://waba.360dialog.io/v1
      - key: D360_PARTNER_TOKEN
        sync: false

  - type: web
    name: qcrm-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://qcrm-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://qcrm-backend.onrender.com

  - type: web
    name: qcrm-admin
    runtime: static
    rootDir: admin-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://qcrm-backend.onrender.com
      - key: VITE_TENANT_DASHBOARD_URL
        value: https://qcrm-dashboard.onrender.com

  - type: web
    name: qcrm-site
    runtime: static
    rootDir: marketing
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: PUBLIC_API_URL
        value: https://qcrm-backend.onrender.com
      - key: PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: PUBLIC_DASHBOARD_URL
        value: https://qcrm-dashboard.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://qcrm-site.onrender.com

databases:
  - name: qcrm-db
    plan: free
    databaseName: qcrm
    user: qcrm
